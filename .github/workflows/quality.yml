name: Small Matter quality

# All automatic quality jobs run only on the dedicated owner-controlled Mac.
# pull_request_target reads this workflow from main, so fork authors cannot
# rewrite the trust guard before GitHub schedules a persistent local runner.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-style:
    # Never execute a fork's code on an owner-persistent self-hosted runner.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, smallmatter]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Use the validated same-repository PR head; otherwise the push SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned format and lint tools
        run: ./scripts/quality_tools.sh install
      - name: Print tool versions
        run: |
          ./scripts/quality_tools.sh versions
          xcodebuild -version
      - name: Format check
        run: ./scripts/quality_tools.sh format Tunix TunixTests TunixUITests --lint
      - name: Lint
        run: ./scripts/quality_tools.sh lint lint --strict Tunix TunixTests TunixUITests --reporter json

  quality-unit:
    # Never execute a fork's code on an owner-persistent self-hosted runner.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, smallmatter]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Use the validated same-repository PR head; otherwise the push SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: App unit tests
        run: ./scripts/run_tunix_app_unit_tests.sh --fresh-derived-data

  quality-release:
    # Never execute a fork's code on an owner-persistent self-hosted runner.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, smallmatter]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Use the validated same-repository PR head; otherwise the push SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Unsigned Release build
        run: ./scripts/build_release.sh --prepare-only
      - name: Structural artifact verification
        run: ./scripts/verify_release_artifact.sh --allow-unsigned --app '.deriveddata/release/Build/Products/Release/Small Matter.app'
      - name: App Store export compliance declaration
        run: ./scripts/verify_app_store_export_compliance.sh
      - name: Direct release archive immutability check
        run: ./scripts/test_direct_archive_guards.sh
      - name: Storefront screenshot packet validation
        run: ./scripts/test_app_store_screenshot_packet.sh

  quality-direct-dmg:
    # Never execute a fork's code on an owner-persistent self-hosted runner.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, smallmatter]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Use the validated same-repository PR head; otherwise the push SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and inspect disposable direct-distribution DMG
        run: ./scripts/test_direct_dmg.sh

  # macOS UI tests require interactive Automation permissions that are not
  # available deterministically on a noninteractive local runner. They remain a
  # mandatory local release gate; see README.md for the exact command.
